<div class="login-container">
    <mat-card class="login-card">
        <mat-card-header>
            <mat-card-title>Iniciar sesión</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Usuario</mat-label>
                <input matInput #usuario type="text" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Contraseña</mat-label>
                <input matInput #contrasena type="password" />
            </mat-form-field>
        </mat-card-content>
        <mat-card-actions>
            <a routerLink="/registro" class="registro-link">Registro</a>
            <button mat-flat-button color="primary" (click)="login(usuario.value, contrasena.value)">Ingresar</button>
        </mat-card-actions>
    </mat-card>
</div>
