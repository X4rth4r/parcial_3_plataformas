<div class="materias-container">
  <mat-card class="materias-card">
    <mat-card-header>
      <mat-card-title>Agregar materia</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Código</mat-label>
        <input matInput #codigo type="text" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput #nombre type="text" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Créditos</mat-label>
        <input matInput #creditos type="number" value="3" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descripción</mat-label>
        <textarea matInput #descripcion rows="3"></textarea>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions>
      <button
        mat-flat-button
        color="primary"
        (click)="guardar(codigo.value, nombre.value, creditos.value, descripcion.value)"
      >
        Guardar
      </button>
    </mat-card-actions>
  </mat-card>

  <mat-card class="tabla-card">
    <mat-card-header>
      <mat-card-title>Lista de materias</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="listaMaterias()" class="full-width">
        @for (col of displayedColumns(); track col) {
          <ng-container [matColumnDef]="col">
            <th mat-header-cell *matHeaderCellDef>{{ col }}</th>
            <td mat-cell *matCellDef="let m">{{ m[col] }}</td>
          </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
